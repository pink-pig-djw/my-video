<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evil Plan MV</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #07070c; color: #eee; font: 13px/1.4 "Nunito", "Segoe UI", sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#c { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; background: #000; display: block; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 12px; background: rgba(0,0,0,.6); display: flex; gap: 10px; align-items: center; }
  #ui input[type=range] { flex: 1; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="ui"><button id="pp">▶</button><input id="seek" type="range" min="0" max="380" step="0.01" value="0"><span id="tc">0.00</span></div>
<script src="data/timing.js"></script>
<script src="core.js"></script>
<script src="mp.js"></script>
<script src="scenes_vec.js"></script>
<script src="scenes_a.js"></script>
<script src="scenes_b.js"></script>
<script src="scenes_c.js"></script>
<script src="lyrics.js"></script>
<script src="shots.js"></script>
<script src="main.js"></script>
</body>
</html>
